name: Reliability gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Retain main/release evidence; cancel only obsolete runs for the same PR.
concurrency:
  group: reliability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deterministic:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Maintained suite
        run: npm --prefix outputs/tennis-local/chrome-extension test
      - name: Reproduction scenarios and worker faults
        run: npm --prefix outputs/tennis-local/chrome-extension run test:scenarios
      - name: Exact runtime package (PowerShell 7)
        shell: pwsh
        run: ./build.ps1
      - name: Documented Windows PowerShell package command (5.1)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./build.ps1
      - name: Create tested release provenance
        shell: pwsh
        run: ./scripts/create-release.ps1 -Commit '${{ github.sha }}'
      - name: Release/update regression tests (PowerShell 7 and 5.1)
        shell: pwsh
        run: |
          ./scripts/test-release.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/test-release.ps1
      - name: Retain exact tested runtime
        uses: actions/upload-artifact@v4
        with:
          name: extension-runtime
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/tennis-booking-v*.zip
            artifacts/release.json
            artifacts/checksums.txt

  browser:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/artifacts/test-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Install pinned test dependency
        run: npm ci --prefix outputs/tennis-local/chrome-extension/test/browser --ignore-scripts
      - name: Install pinned Chromium
        run: node outputs/tennis-local/chrome-extension/test/browser/node_modules/playwright/cli.js install chromium
      # Includes local-only merchant, real extension scripts and external network-denial checks.
      # Do not run test:ci here: the deterministic job owns the Node tests and package checks.
      - name: Isolated Chromium and network-denial gate
        run: npm --prefix outputs/tennis-local/chrome-extension run test:browser
      - name: Retain sanitized fake-site evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-browser-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: |
            artifacts/browser-gate-*/report.json
            artifacts/browser-gate-*/failure.json
            artifacts/browser-gate-*/failure.png
            artifacts/browser-reload-*/report.json

  publish:
    needs: [deterministic, browser]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: development-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: actions/download-artifact@v4
        with:
          name: extension-runtime
          path: artifacts
      - name: Publish verified development prerelease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs artifacts
